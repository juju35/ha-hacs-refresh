name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump the version in manifest.json, add its CHANGELOG.md section, push, and the release follows
# once Validate (hassfest, tests), Lint and HACS Validation have all passed on that commit,
# so a broken main is never released. Each of them triggers this workflow when it completes;
# the release happens on the last one, when the "Check required workflows" step sees all three green.
on:
  workflow_run:
    workflows: [Validate, Lint, HACS Validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Two of the gating workflows can finish at the same time: run one release at a time, so the
# second one sees the tag created by the first and does nothing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only after a successful run on a push to main (not on a pull request or the nightly run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the workflows checked, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check required workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Latest run of each required workflow on this commit (a re-run replaces the previous result).
          ready=true
          for wf in validate.yml lint.yml hacs.yml; do
            run=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[]] | max_by(.id) // empty | "\(.status) \(.conclusion)"')
            echo "$wf: ${run:-no run}"
            case "$run" in
              "completed success") ;;
              "completed "*) echo "::warning::$wf did not pass on $SHA ($run): not releasing"; ready=false ;;
              *) echo "::notice::$wf has not finished on $SHA yet: the release waits for it"; ready=false ;;
            esac
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: version
        if: steps.gate.outputs.ready == 'true'
        run: |
          VERSION="$(jq -r .version custom_components/hacs_refresh/manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          (cd custom_components/hacs_refresh && zip -r ../../hacs_refresh.zip . -x "__pycache__/*" "brand/*")
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: hacs_refresh.zip
          body_path: notes.md
          make_latest: true
