name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump the version in manifest.json, const.py and the card, add its CHANGELOG.md section, push, and the release follows
# once Lint, Validate (hassfest, tests) and HACS Validation, called here, have all passed on that commit,
# so a broken main is never released.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  hacs:
    uses: ./.github/workflows/hacs.yml
    permissions:
      contents: read

  release:
    needs: [lint, validate, hacs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r .version custom_components/hacs_refresh/manifest.json)"
          grep -q "VERSION: Final = \"$VERSION\"" custom_components/hacs_refresh/const.py
          grep -q "HACS_REFRESH_CARD_VERSION = '$VERSION'" custom_components/hacs_refresh/frontend/hacs-refresh-card.js
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          (cd custom_components/hacs_refresh && zip -r ../../hacs_refresh.zip . -x "__pycache__/*")
          # Home Assistant 2026.3+ shows the integration's icon from custom_components/hacs_refresh/brand/.
          unzip -l hacs_refresh.zip | grep -q " brand/icon.png$"
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: hacs_refresh.zip
          body_path: notes.md
          make_latest: true
