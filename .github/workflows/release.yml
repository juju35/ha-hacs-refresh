name: Release

# Publishes a GitHub release whenever main carries a version that has no tag yet:
# bump the version in manifest.json, add its CHANGELOG.md section, push, and the release follows
# once Validate (hassfest and tests) has passed on that push, so a broken main is never released.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Only after a successful Validate run on a push to main (not on a pull request or the nightly run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit Validate checked, not whatever main points to now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(jq -r .version custom_components/hacs_refresh/manifest.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip and notes
        if: steps.version.outputs.exists == 'false'
        run: |
          (cd custom_components/hacs_refresh && zip -r ../../hacs_refresh.zip . -x "__pycache__/*" "brand/*")
          .github/scripts/release-notes.sh "${{ steps.version.outputs.version }}" > notes.md
          test -s notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          files: hacs_refresh.zip
          body_path: notes.md
          make_latest: true
